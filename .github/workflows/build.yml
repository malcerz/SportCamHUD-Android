name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core
        run: ./gradlew --no-daemon :core:test
      # PRs must not receive signing secrets (including PRs from forks).
      - name: Build debug APK for PR validation
        if: github.event_name == 'pull_request'
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Restore developer signing keystore
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for key in SIGNING_KEYSTORE_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ -z "$(printenv "$key")" ]]; then
              echo "::error::Missing signing secret for $key. Supported names: KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD (or ANDROID_ prefix)."
              exit 1
            fi
          done
          KEYSTORE_FILE="$RUNNER_TEMP/sportcamhud-signing-keystore"
          (umask 077; printf "%s" "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE")
          test -s "$KEYSTORE_FILE" || { echo "::error::Signing keystore is empty."; exit 1; }
          keytool -list -keystore "$KEYSTORE_FILE" -storepass:env ANDROID_SIGNING_STORE_PASSWORD -alias "$ANDROID_SIGNING_KEY_ALIAS" >/dev/null
          STORE_TYPE="$(LC_ALL=C keytool -list -keystore "$KEYSTORE_FILE" -storepass:env ANDROID_SIGNING_STORE_PASSWORD | sed -n "s/^Keystore type: //p" | head -n 1)"
          test -n "$STORE_TYPE" || { echo "::error::Could not detect keystore type."; exit 1; }
          echo "ANDROID_SIGNING_STORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_STORE_TYPE=$STORE_TYPE" >> "$GITHUB_ENV"
          echo "Developer signing keystore validated ($STORE_TYPE)."
      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify APK certificate against developer keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk SportCamHUD-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "::error::Android apksigner not found."; exit 1; }
          "$APKSIGNER" verify --verbose SportCamHUD-release.apk
          # Hash the canonical DER certificate bytes, not human-readable keytool output.
          KEY_SHA="$(keytool -exportcert -keystore "$ANDROID_SIGNING_STORE_FILE" -storepass:env ANDROID_SIGNING_STORE_PASSWORD -alias "$ANDROID_SIGNING_KEY_ALIAS" 2>/dev/null | sha256sum | cut -d " " -f 1)"
          # Output labels vary between Android Build Tools; match the certificate hash itself.
          APK_CERT_INFO="$("$APKSIGNER" verify --print-certs --verbose SportCamHUD-release.apk 2>&1)"
          echo "Developer certificate SHA-256: $KEY_SHA"
          echo "APK certificate fingerprint lines:"
          printf "%s\n" "$APK_CERT_INFO" | grep -Ei "sha.?256" || true
          NORMALIZED_CERT_INFO="$(printf "%s\n" "$APK_CERT_INFO" | tr "[:upper:]" "[:lower:]" | tr -d ":")"
          test -n "$KEY_SHA" && grep -Fq "$KEY_SHA" <<< "$NORMALIZED_CERT_INFO" || { echo "::error::APK signing certificate does not match the developer keystore."; exit 1; }
          echo "APK signature matches configured developer keystore."
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: SportCamHUD-pr-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: SportCamHUD-signed-release-apk
          path: SportCamHUD-release.apk
      - name: Publish signed APK to latest release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SportCamHUD (najnowsza wersja)
          prerelease: true
          files: SportCamHUD-release.apk
